[workspace]
members = [
    "src/library",
    "src/examples/getting-started/vision-data",
    "src/examples/getting-started/imagenet64",
    "src/examples/getting-started/mnist",
    "src/examples/getting-started/fashion-mnist",
    "src/examples/getting-started/cifar100",
    "src/examples/training/mlp",
    "src/examples/training/cnn",
    "src/examples/training/attention",
    "src/examples/training/muon",
    "src/studies/contracts/generated-addition",
    "src/studies/contracts/mnist-population",
    "src/studies/energy-output/panel",
    "src/studies/physics/damped-pendulum",
]
default-members = ["src/examples/getting-started/mnist"]
resolver = "3"

[workspace.package]
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
cutile = "=0.3.1"
axis = { path = "src/library" }
