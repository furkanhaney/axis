[workspace]
members = [
    "src/library",
    "src/examples/mlp",
    "src/examples/cnn",
    "src/examples/attention",
    "src/examples/addition",
    "src/examples/muon",
    "src/studies/training-dynamics/mnist",
    "src/studies/training-dynamics/mnist-population",
    "src/studies/energy-output/panel",
]
default-members = ["src/examples/mlp"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
cutile = "=0.3.1"
axis = { path = "src/library" }
