name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_pr:
        description: "Open release PR to permit; leave empty for a strict check"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-and-compile:
    runs-on: ubuntu-latest
    container:
      image: nvidia/cuda:13.3.0-devel-ubuntu24.04
      env:
        DEBIAN_FRONTEND: noninteractive
    env:
      CUDA_TOOLKIT_PATH: /usr/local/cuda
    timeout-minutes: 30

    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git libclang-dev pkg-config

      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Trust the mounted checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install Rust 1.89
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain 1.89.0 \
              --component rustfmt,clippy

      - name: Verify repository structure and setup helper
        run: |
          bash scripts/checks/structure.sh
          bash tests/setup_cuda.sh
          bash tests/release_readiness.sh

      - name: Check formatting
        run: |
          . "${HOME}/.cargo/env"
          cargo fmt --all -- --check

      - name: Lint workspace
        run: |
          . "${HOME}/.cargo/env"
          cargo clippy --workspace --release --locked --all-targets -- -D warnings

      - name: Run host tests
        run: |
          . "${HOME}/.cargo/env"
          cargo test --workspace --release --locked

      - name: Verify published package contents
        run: |
          . "${HOME}/.cargo/env"
          cargo package -p axis --locked

  release-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read

    steps:
      - name: Check out the repository and release comparison base
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require a clear repository at the release boundary
        env:
          AXIS_EVENT: ${{ github.event_name }}
          AXIS_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          AXIS_CURRENT_PR: ${{ github.event.pull_request.number || inputs.release_pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--repository "$GITHUB_REPOSITORY")
          if [[ "$AXIS_EVENT" == "pull_request" ]]; then
            args+=(--base-ref "$AXIS_BASE_SHA" --allow-pr "$AXIS_CURRENT_PR")
          elif [[ "$AXIS_EVENT" == "push" ]]; then
            args+=(--base-ref "$AXIS_BASE_SHA")
          elif [[ -n "$AXIS_CURRENT_PR" ]]; then
            args+=(--allow-pr "$AXIS_CURRENT_PR")
          fi
          bash scripts/checks/release-readiness.sh "${args[@]}"
