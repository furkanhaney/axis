[package]
name = "axis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = true
license = "MIT"
description = "Named-axis tensors, training, and executable research invariants on NVIDIA cuTile"
repository = "https://github.com/furkanhaney/axis"
homepage = "https://github.com/furkanhaney/axis"
documentation = "https://docs.rs/axis"
readme = "README.md"
keywords = ["machine-learning", "cuda", "tensor", "gpu", "research"]
categories = ["science", "mathematics"]
include = ["src/**", "build.rs", "README.md", "LICENSE.md"]

[features]
default = ["cuda"]
cuda = ["dep:cutile"]

[package.metadata.docs.rs]
no-default-features = true
targets = []

[dependencies]
cutile = { workspace = true, optional = true }
