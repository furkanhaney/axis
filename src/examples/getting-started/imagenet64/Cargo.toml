[package]
name = "axis-imagenet64"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axis.workspace = true
axis-vision-data = { path = "../vision-data" }
zip = { version = "5.1.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "prepare"
path = "src/prepare.rs"

[[bin]]
name = "train"
path = "src/train.rs"
